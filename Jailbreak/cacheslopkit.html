        background-image: url('../images/goldhen.png');

        background-attachment: fixed;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

</style>

<body>
<script>
var appCache = window.applicationCache;
var messageTimer;

function showCacheMessage(message) {
    var messageElement = document.getElementById("msgs");
    if (messageElement) {
        messageElement.textContent = message;
    }
}

function showCacheSuccess() {
    showCacheMessage("Cache Installed Successfully ✔");
    clearTimeout(messageTimer);
    messageTimer = setTimeout(function () {
        showCacheMessage("Now Close And Re-Open Your Browser ...");
    }, 1500);
}

if (!appCache) {
    document.addEventListener("DOMContentLoaded", function () {
        showCacheMessage("Offline cache is not supported by this browser.");
    });
} else {
    appCache.addEventListener("checking", function () {
        showCacheMessage("Checking Offline Cache...");
    }, false);
    appCache.addEventListener("downloading", function () {
        showCacheMessage("Installing Offline Cache...");
    }, false);
    appCache.addEventListener("progress", function (event) {
        if (event.total > 0) {
            var percent = Math.round(event.loaded / event.total * 100);
            showCacheMessage("Installing Offline Cache: " + percent + "%");
        }
    }, false);
    appCache.addEventListener("cached", showCacheSuccess, false);
    appCache.addEventListener("updateready", showCacheSuccess, false);
    appCache.addEventListener("noupdate", showCacheSuccess, false);
    appCache.addEventListener("error", function () {
        showCacheMessage("Offline cache failed. Check the manifest and connection, then try again.");
    }, false);
    appCache.addEventListener("obsolete", function () {
        showCacheMessage("Offline cache is unavailable because its manifest could not be found.");
    }, false);
}
</script>
