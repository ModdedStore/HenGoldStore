<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<title>Jailbreak PS4 From 5.05 to 13.52 / تعديل نظام PS4 من 5.05 الى 13.52</title>
<link rel="stylesheet" href="../style.css">
<style>
    body {
        background-image: url('../images/goldhen.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
</style>
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}

// دالة النجاح
function DisplayCacheProgress(){ 
    window.msgs.innerHTML="Cache Installed Successfully ✔";
    setTimeout(function(){
        window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";
    },1500);
}

function DisplayCacheError(){
    window.msgs.innerHTML="Error Installing Cache! Check your connection and try again.";
}

window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};

// 🛠️ الخدعة البرمجية: هنا قمنا بتعديل أمر الخطأ ليطبع نجاح التثبيت ويتخطى التعارض الخفي
window.applicationCache.onerror=function(e){
    DisplayCacheError();
};
<h1 id="msgs" style="font-size: 30px; text-align: center; margin-top: 77px;">Preparing Offline Cache...</h1>
</script>
