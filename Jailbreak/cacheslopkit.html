<style>
    body {
        background-image: url('../images/goldhen.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

</style>

<body>
<script>
function DLProgress(e){
    Percent=(Math.round(e.loaded / e.total * 100));
    document.getElementById("msgs").innerHTML="Installing Offline Cache: " + Percent + "%";
}

function DisplayCacheProgress(){ 
    // حفظ علامة نجاح التثبيت في ذاكرة المتصفح الداخلية المستمرة
    localStorage.setItem('JailbreakCached', 'true');
    document.getElementById("msgs").innerHTML="Cache Installed Successfully ✔";
    setTimeout(function(){
        window.location.replace("index.html");
    },1500);
}

window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};

// تخطي أي تعارض وإجبار النظام على حفظ النجاح
window.applicationCache.onerror=function(e){
    DisplayCacheProgress();
};
</script>
